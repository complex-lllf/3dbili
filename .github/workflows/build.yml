name: Build 3DS Homebrew

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm-3ds:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug env
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          ls /opt/devkitpro/libctru/ | head
          command -v arm-none-eabi-gcc
          command -v 3dsxtool || true
          command -v smdhtool || true

      - name: Build
        run: make

      - name: Upload 3dsx artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-gui-3dsx
          path: |
            hello-gui.3dsx
            hello-gui.elf
            hello-gui.smdh
          if-no-files-found: error
