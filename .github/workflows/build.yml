name: Build 3DS Homebrew

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install 3DS development packages
        run: |
          dkp-pacman -S --noconfirm 3ds-dev

      - name: Verify environment
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          ls /opt/devkitpro/libctru/3ds_rules
          command -v arm-none-eabi-gcc

      - name: Build
        run: make

      - name: Upload 3dsx artifact
        uses: actions/upload-artifact@v4
        with:
          name: hello-gui-3dsx
          path: |
            hello-gui.3dsx
            hello-gui.elf
            hello-gui.smdh
          if-no-files-found: error
